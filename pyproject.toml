[project]
name = "socio-ia"
version = "1.0.0b1"
description = "Sócio IA — time de agentes que trabalha dentro da empresa (versão 1.0 Beta)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
socio-ia = "socio_ia.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["socio_ia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
